<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Belajar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="keyboard-app">
        <h1>⌨️ Keyboard Belajar</h1>

        <textarea id="display" placeholder="Ketik menggunakan keyboard di bawah..."></textarea>

        <div class="keyboard">

            <div class="row">
                <button>Q</button>
                <button>W</button>
                <button>E</button>
                <button>R</button>
                <button>T</button>
                <button>Y</button>
                <button>U</button>
                <button>I</button>
                <button>O</button>
                <button>P</button>
            </div>

            <div class="row">
                <button>A</button>
                <button>S</button>
                <button>D</button>
                <button>F</button>
                <button>G</button>
                <button>H</button>
                <button>J</button>
                <button>K</button>
                <button>L</button>
            </div>

            <div class="row">
                <button>Z</button>
                <button>X</button>
                <button>C</button>
                <button>V</button>
                <button>B</button>
                <button>N</button>
                <button>M</button>
            </div>

            <div class="row special">
                <button id="backspace">⌫ Hapus</button>
                <button id="space">SPACE</button>
                <button id="enter">ENTER</button>
            </div>

        </div>

        <button id="clear">🗑️ Bersihkan</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
